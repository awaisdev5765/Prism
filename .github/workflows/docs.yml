name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build API docs and the gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Provision GitHub Pages on first run instead of failing the deploy with a
      # 404 that asks a human to flip a switch in the repository settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: subosito/flutter-action@v2
        with:
          # Pinned deliberately: a floating `stable` moves the formatter and
          # analyser under you, and `dart format --set-exit-if-changed` then
          # fails on code that is already correctly formatted for the version
          # the project is developed against.
          flutter-version: '3.41.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Run the suite here rather than trusting a number someone typed into a
      # template. Several suites generate their cases in loops, so counting
      # declarations understates the real total, and the landing page should not
      # claim a figure it cannot reproduce. A failing suite also stops the docs
      # from shipping a page that says "tests passing".
      - name: Run tests and capture the count
        run: |
          set -o pipefail
          output=$(flutter test 2>&1)
          echo "$output" | tail -3
          count=$(echo "$output" | grep -oE '\+[0-9]+' | tail -1 | tr -d '+')
          if [ -z "$count" ]; then
            echo "Could not read a test count; the page will report a lower bound."
            count=""
          fi
          echo "TESTS=$count" >> "$GITHUB_ENV"

      - name: Generate the landing page
        run: |
          if [ -n "${TESTS}" ]; then
            python3 site/build.py --tests "${TESTS}"
          else
            python3 site/build.py
          fi

      - name: Generate API documentation
        run: dart doc --output build/docs/api

      - name: Build the example gallery for the web
        working-directory: example
        run: |
          flutter pub get
          # The gallery lives under /gallery/ so a landing page can own the root.
          flutter build web --base-href /Prism/gallery/

      - name: Assemble the site
        run: |
          mkdir -p build/site/gallery build/site/api
          # Landing page at the root, gallery and API reference beside it.
          cp -R site/. build/site/
          cp -R example/build/web/. build/site/gallery/
          cp -R build/docs/api/. build/site/api/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
