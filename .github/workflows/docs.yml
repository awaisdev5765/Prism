name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build API docs and the gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate API documentation
        run: dart doc --output build/docs/api

      - name: Build the example gallery for the web
        working-directory: example
        run: |
          flutter pub get
          flutter build web --base-href /Prism/

      - name: Assemble the site
        run: |
          mkdir -p build/site
          cp -R example/build/web/. build/site/
          mkdir -p build/site/api
          cp -R build/docs/api/. build/site/api/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
