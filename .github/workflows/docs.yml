name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build API docs and the gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Provision GitHub Pages on first run instead of failing the deploy with a
      # 404 that asks a human to flip a switch in the repository settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: subosito/flutter-action@v2
        with:
          # Pinned deliberately: a floating `stable` moves the formatter and
          # analyser under you, and `dart format --set-exit-if-changed` then
          # fails on code that is already correctly formatted for the version
          # the project is developed against.
          flutter-version: '3.41.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Run the suite here rather than trusting a number someone typed into a
      # template: several suites generate their cases in loops, so counting
      # declarations understates the real total, and the page should not claim a
      # figure it cannot reproduce.
      #
      # JSON rather than the human reporter, because the page states a count and
      # parsing formatted output is fragile -- it wraps numbers in ANSI codes,
      # trails the summary with a tearDownAll line, and a test name can contain a
      # '+'. The exit status is still the test result, so a red suite fails here.
      - name: Run tests
        run: flutter test --reporter json > /tmp/test-report.json

      - name: Summarise the run and read the count
        # Always runs. When the suite is red this summary is the most useful
        # line in the log, and the job has already failed so the deploy is
        # skipped regardless.
        if: always()
        run: |
          count=$(python3 site/test_summary.py /tmp/test-report.json 2>/tmp/summary.txt || true)
          cat /tmp/summary.txt
          if [ -z "$count" ]; then
            echo "No count available; the page will report a lower bound."
          fi
          echo "TESTS=$count" >> "$GITHUB_ENV"

      - name: Generate the landing page
        run: |
          if [ -n "${TESTS}" ]; then
            python3 site/build.py --tests "${TESTS}"
          else
            python3 site/build.py
          fi

      - name: Generate API documentation
        run: dart doc --output build/docs/api

      - name: Build the example gallery for the web
        working-directory: example
        run: |
          flutter pub get
          # The gallery lives under /gallery/ so a landing page can own the root.
          flutter build web --base-href /Prism/gallery/

      - name: Assemble the site
        run: |
          mkdir -p build/site/gallery build/site/api
          # Landing page at the root, gallery and API reference beside it.
          cp -R site/. build/site/
          cp -R example/build/web/. build/site/gallery/
          cp -R build/docs/api/. build/site/api/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
