name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned deliberately: a floating `stable` moves the formatter and
          # analyser under you, and `dart format --set-exit-if-changed` then
          # fails on code that is already correctly formatted for the version
          # the project is developed against.
          flutter-version: '3.41.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        # --output=show prints the diff it objects to, so a failure names the
        # file and the hunk instead of just exiting non-zero.
        run: dart format --output=show --set-exit-if-changed lib test

      - name: Analyze (strict)
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage --reporter expanded

      # The threshold sits a little below the current figure on purpose: enough
      # headroom that ordinary churn does not fail the build, tight enough that a
      # real regression does. The script prints the weakest files either way, so
      # the number comes with somewhere to look.
      - name: Check coverage
        run: dart run tool/check_coverage.dart coverage/lcov.info --min 88

  example:
    name: Example builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned deliberately: a floating `stable` moves the formatter and
          # analyser under you, and `dart format --set-exit-if-changed` then
          # fails on code that is already correctly formatted for the version
          # the project is developed against.
          flutter-version: '3.41.4'
          cache: true

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze
