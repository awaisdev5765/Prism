name: prism_kit
description: >-
  One dependency, 50 adaptive Flutter components on a shared design system:
  data tables, calendar, tabs, toasts, forms, controls, loading and empty
  states, markdown, an AI chat client, and more.
version: 1.5.0
homepage: https://github.com/awaisdev5765/prism
repository: https://github.com/awaisdev5765/prism
issue_tracker: https://github.com/awaisdev5765/prism/issues
# Shown by pub.dev as the Documentation link: a landing page with the live
# gallery and the API reference behind it.
documentation: https://awaisdev5765.github.io/Prism/
topics:
  - widgets
  - components
  - ui
  - adaptive
  - responsive

environment:
  sdk: ^3.9.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  markdown: ^7.3.0
  meta: ^1.16.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  material_color_utilities: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
